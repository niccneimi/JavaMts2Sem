server:
  port: 8081

spring:
  application:
    name: demo-app-test

logging:
  level:
    com.example: DEBUG
    org.springframework.test: INFO
    
resilience4j:
  ratelimiter:
    instances:
      financeService:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 100ms
      emailService:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 100ms
      
  circuitbreaker:
    instances:
      userApiService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 1s
        failureRateThreshold: 50
      emailService:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 1s
        failureRateThreshold: 50 